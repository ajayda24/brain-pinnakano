<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" width="1040" height="640" font-family="Segoe UI, system-ui, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#868ea9"/>
    </marker>
    <style>
      .box  { rx: 12; ry: 12; stroke-width: 1; }
      .t    { font-size: 14px; font-weight: 700; fill: #1b2340; }
      .s    { font-size: 11px; fill: #5a6386; }
      .lbl  { font-size: 10.5px; fill: #868ea9; }
      .ln   { stroke: #868ea9; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
      .grp  { font-size: 11px; font-weight: 700; fill: #868ea9; letter-spacing: .08em; }
    </style>
  </defs>

  <rect width="1040" height="640" fill="#f1f3f9"/>

  <text x="34" y="40" font-size="19" font-weight="700" fill="#1b2340">PINNAKK OS — signal pipeline</text>
  <text x="34" y="62" class="s">Everything below runs inside the browser tab. There is no server and no network call.</text>

  <!-- ============ capture ============ -->
  <text x="34" y="104" class="grp">CAPTURE</text>

  <rect x="34" y="118" width="188" height="78" class="box" fill="#eaf1fd" stroke="#cfe0f8"/>
  <text x="52" y="146" class="t">Webcam</text>
  <text x="52" y="166" class="s">getUserMedia, 640×480</text>
  <text x="52" y="182" class="s">frames discarded each tick</text>

  <rect x="34" y="216" width="188" height="78" class="box" fill="#eaf1fd" stroke="#cfe0f8"/>
  <text x="52" y="244" class="t">MediaPipe</text>
  <text x="52" y="264" class="s">FaceLandmarker, WASM</text>
  <text x="52" y="280" class="s">vendored — no CDN</text>

  <rect x="34" y="314" width="188" height="78" class="box" fill="#efecfb" stroke="#ddd6f6"/>
  <text x="52" y="342" class="t">Simulation</text>
  <text x="52" y="362" class="s">fallback when the camera</text>
  <text x="52" y="378" class="s">or model is unavailable</text>

  <line x1="128" y1="196" x2="128" y2="214" class="ln"/>
  <path d="M 222 255 L 252 255" class="ln"/>
  <path d="M 222 353 L 240 353 L 240 275 L 252 275" class="ln"/>

  <!-- ============ interpretation ============ -->
  <text x="264" y="104" class="grp">INTERPRETATION</text>

  <rect x="264" y="216" width="196" height="96" class="box" fill="#ffffff" stroke="#e2e6f0"/>
  <text x="282" y="244" class="t">signals.ts</text>
  <text x="282" y="264" class="s">52 blendshapes + head pose</text>
  <text x="282" y="280" class="s">→ smile, laugh, confusion,</text>
  <text x="282" y="296" class="s">gaze, blink, motion (EMA)</text>

  <rect x="264" y="336" width="196" height="82" class="box" fill="#ffffff" stroke="#e2e6f0"/>
  <text x="282" y="364" class="t">events.ts</text>
  <text x="282" y="384" class="s">hysteresis + cooldown so</text>
  <text x="282" y="400" class="s">nothing fires every frame</text>

  <line x1="362" y1="312" x2="362" y2="334" class="ln"/>
  <text x="372" y="328" class="lbl">discrete events</text>

  <!-- ============ state ============ -->
  <text x="502" y="104" class="grp">STATE</text>

  <rect x="502" y="118" width="212" height="86" class="box" fill="#e7f6ef" stroke="#cfe9dc"/>
  <text x="520" y="146" class="t">metricsEngine</text>
  <text x="520" y="166" class="s">10 Hz tick · eases every</text>
  <text x="520" y="182" class="s">metric toward a target</text>
  <text x="520" y="196" class="s">CPU column sums to the total</text>

  <rect x="502" y="224" width="212" height="72" class="box" fill="#ffffff" stroke="#e2e6f0"/>
  <text x="520" y="252" class="t">process table</text>
  <text x="520" y="272" class="s">spawns Laughing.exe,</text>
  <text x="520" y="288" class="s">crashes Focus.exe …</text>

  <rect x="502" y="316" width="212" height="60" class="box" fill="#ffffff" stroke="#e2e6f0"/>
  <text x="520" y="344" class="t">toasts + commentary</text>
  <text x="520" y="362" class="s">HUMAN.EXE NOT RESPONDING</text>

  <rect x="502" y="396" width="212" height="60" class="box" fill="#fdf4e7" stroke="#f2e3ca"/>
  <text x="520" y="424" class="t">session log</text>
  <text x="520" y="442" class="s">laughs, idle time, games</text>

  <path d="M 460 364 L 480 364 L 480 161 L 500 161" class="ln"/>
  <path d="M 460 372 L 480 372 L 480 260 L 500 260" class="ln"/>
  <path d="M 460 380 L 480 380 L 480 346 L 500 346" class="ln"/>
  <path d="M 460 388 L 480 388 L 480 426 L 500 426" class="ln"/>

  <!-- ============ surface ============ -->
  <text x="756" y="104" class="grp">SURFACE</text>

  <rect x="756" y="118" width="250" height="86" class="box" fill="#ffffff" stroke="#e2e6f0"/>
  <text x="774" y="146" class="t">Dashboard</text>
  <text x="774" y="166" class="s">KPI tiles · Performance tab</text>
  <text x="774" y="182" class="s">Task Manager · Pinnakk Manager</text>
  <text x="774" y="196" class="s">hot values written to the DOM</text>

  <rect x="756" y="224" width="250" height="72" class="box" fill="#ffffff" stroke="#e2e6f0"/>
  <text x="774" y="252" class="t">Reel Lab</text>
  <text x="774" y="272" class="s">16 built-in reels, shuffled</text>
  <text x="774" y="288" class="s">reaction sampled at 4 Hz</text>

  <rect x="756" y="316" width="250" height="72" class="box" fill="#ffffff" stroke="#e2e6f0"/>
  <text x="774" y="344" class="t">Brain Lab</text>
  <text x="774" y="364" class="s">Don't Laugh · Poker Face</text>
  <text x="774" y="380" class="s">Stare Contest · Human Captcha</text>

  <rect x="756" y="408" width="250" height="86" class="box" fill="#fdf4e7" stroke="#f2e3ca"/>
  <text x="774" y="436" class="t">Final report → Certificate</text>
  <text x="774" y="456" class="s">score, classification, and a</text>
  <text x="774" y="472" class="s">canvas-drawn PNG you can</text>
  <text x="774" y="488" class="s">download or share</text>

  <path d="M 714 161 L 754 161" class="ln"/>
  <path d="M 714 260 L 734 260 L 734 260 L 754 260" class="ln"/>
  <path d="M 714 346 L 734 346 L 734 352 L 754 352" class="ln"/>
  <path d="M 714 426 L 734 426 L 734 451 L 754 451" class="ln"/>

  <!-- reel/game feedback into the engine -->
  <path d="M 880 296 L 880 306 L 730 306 L 730 204 L 714 204" class="ln" stroke-dasharray="4 4"/>
  <text x="742" y="302" class="lbl">reel activity raises പിണ്ണാക്ക്</text>

  <!-- footer -->
  <rect x="34" y="556" width="972" height="54" class="box" fill="#fdedf1" stroke="#f7d9e1"/>
  <text x="52" y="582" class="t">Every number produced by this pipeline is fictional.</text>
  <text x="52" y="600" class="s">It diagnoses nothing. No frame, measurement, or result ever leaves the device — the app has no backend to send it to.</text>
</svg>
